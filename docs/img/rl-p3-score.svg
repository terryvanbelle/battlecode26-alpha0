<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-label="rl-p3: plan-head learner (plans held 500 rounds, per-game sampling) vs its start net and vs zdb">
<style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--grid:#e4e3df;--s0:#2a78d6;--s1:#eb6834;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
@media (prefers-color-scheme: dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--grid:#3a3936;--s0:#3987e5;--s1:#d95926;}}
.t{fill:var(--ink);font-size:15px;font-weight:600}.st{fill:var(--ink2);font-size:12px}.ax{fill:var(--ink2);font-size:11px}.lg{fill:var(--ink);font-size:12px}.gl{stroke:var(--grid);stroke-width:1}.ref{stroke:var(--ink2);stroke-width:1;stroke-dasharray:4 4}.mk{stroke:var(--ink2);stroke-width:1;stroke-dasharray:2 3}.wh0{stroke:var(--s0);stroke-width:2;stroke-linecap:round;opacity:.5}.dot0{fill:var(--s0);stroke:var(--surface);stroke-width:2}.ln0{stroke:var(--s0);stroke-width:2;fill:none;opacity:.45}.wh1{stroke:var(--s1);stroke-width:2;stroke-linecap:round;opacity:.5}.dot1{fill:var(--s1);stroke:var(--surface);stroke-width:2}.ln1{stroke:var(--s1);stroke-width:2;fill:none;opacity:.45}
</style>
<rect width="720" height="380" fill="var(--surface)"/>
<text class="t" x="64" y="24">rl-p3: plan-head learner (plans held 500 rounds, per-game sampling) vs its start net and vs zdb</text>
<text class="st" x="64" y="43">Score (win 1, draw 0.5) with Wilson 95% interval; hover a point for its numbers.</text>
