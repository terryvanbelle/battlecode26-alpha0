<g><title>v2 vs the start net v0 (pool games): 25/52 = 0.48 (95% 0.35-0.61)</title><line class="wh0" x1="316.8" x2="316.8" y1="239.8" y2="176.8"/><circle class="dot0" cx="316.8" cy="208.6" r="5"/></g>
